<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TekserAI — проверка требований</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141210'/%3E%3Crect x='7' y='14' width='18' height='6' rx='1.5' fill='%23f2d04b'/%3E%3Cpath d='M8 9h16M8 24h11' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Дизайн-система — скилл ui-ux-pro-max, запрос «document review compliance tool fintech professional»:
   стиль «Minimalism & Swiss Style», палитра «Trust navy + signature green + audit trail», шрифт IBM Plex Sans.
   Макет: модульная сетка, жёсткая типографика, тонкие линии вместо карточек-теней, острые углы.
   Navy — бренд и структура; зелёный — действие и «подтверждено»; синий — ссылки и фокус;
   жёлтый маркер — только для мест замечаний в документе. */
:root{
  --bg:#F8FAFC;--panel:#FFFFFF;--sheet:#FFFFFF;--fg:#0F172A;--muted:#475569;--faint:#64748B;
  --line:#CBD5E1;--hair:#E2E8F0;--soft:#F1F5F9;--soft2:#E9EEF5;
  --acc:#1E3A5F;--acc-2:#152A47;--acc-soft:#E3EAF4;--acc-fg:#FFFFFF;
  --link:#2563EB;
  --cta:#16A34A;--cta-2:#15803D;--cta-fg:#000000;
  --mark:#FDE047;--mark-soft:#FEF9C3;
  --crit:#DC2626;--crit-soft:#FEECEC;--major:#B45309;--major-soft:#FEF3E2;--minor:#475569;--minor-soft:#EEF2F6;
  --ok:#15803D;--ok-soft:#E6F4EA;
  --shadow-lg:0 14px 30px -16px rgba(15,23,42,.30);
  --f-display:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Liberation Mono",monospace;
  --r:4px;--ease:cubic-bezier(.22,1,.36,1);--back:cubic-bezier(.34,1.45,.64,1);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220;--panel:#101A2C;--sheet:#121D31;--fg:#E2E8F0;--muted:#A3B1C6;--faint:#8494AB;
  --line:#2A3A55;--hair:#1E2B42;--soft:#152238;--soft2:#1B2A44;
  --acc:#8FB3E3;--acc-2:#B0CBEE;--acc-soft:#18294A;--acc-fg:#0B1220;
  --link:#7AA7FF;--cta:#22C55E;--cta-2:#4ADE80;--cta-fg:#04130A;
  --mark:#E5C736;--mark-soft:#3A3412;
  --crit:#F87171;--crit-soft:#2C1517;--major:#F59E0B;--major-soft:#2B1F0C;--minor:#A3B1C6;--minor-soft:#182338;
  --ok:#4ADE80;--ok-soft:#0E2618;--shadow-lg:0 14px 30px -16px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220;--panel:#101A2C;--sheet:#121D31;--fg:#E2E8F0;--muted:#A3B1C6;--faint:#8494AB;
  --line:#2A3A55;--hair:#1E2B42;--soft:#152238;--soft2:#1B2A44;
  --acc:#8FB3E3;--acc-2:#B0CBEE;--acc-soft:#18294A;--acc-fg:#0B1220;
  --link:#7AA7FF;--cta:#22C55E;--cta-2:#4ADE80;--cta-fg:#04130A;
  --mark:#E5C736;--mark-soft:#3A3412;
  --crit:#F87171;--crit-soft:#2C1517;--major:#F59E0B;--major-soft:#2B1F0C;--minor:#A3B1C6;--minor-soft:#182338;
  --ok:#4ADE80;--ok-soft:#0E2618;--shadow-lg:0 14px 30px -16px rgba(0,0,0,.75);color-scheme:dark}

*{box-sizing:border-box}
html,body{overflow-x:clip;margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:2px}
::selection{background:var(--mark);color:#111}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:transform .45s var(--ease),box-shadow .3s}
.top.hide{transform:translateY(-100%)}
.top.scrolled{box-shadow:0 1px 0 var(--hair),0 8px 24px -20px rgba(15,23,42,.5)}
.top .in{max-width:1320px;margin:0 auto;padding:10px max(16px,3vw);display:flex;align-items:center;gap:20px;position:relative;transition:padding .35s var(--ease)}
.top.scrolled .in{padding-top:6px;padding-bottom:6px}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .12s linear}
.brand{display:flex;align-items:center;gap:12px;color:var(--fg);min-height:44px}
.brand:hover{text-decoration:none}
.logo{width:34px;height:34px;border-radius:2px;background:var(--acc);display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.logo i{position:absolute;left:7px;right:7px;height:2.4px;background:var(--acc-fg)}
.logo i:nth-child(1){top:10px}.logo i:nth-child(3){top:23px;right:13px}
.logo i:nth-child(2){top:15px;height:6px;background:var(--mark);transform-origin:left;animation:logomark 3.4s var(--ease) infinite}
@keyframes logomark{0%,15%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.logo-img{width:34px;height:34px;object-fit:contain;flex:none;display:none}
.brand.has-logo .logo-img{display:block}.brand.has-logo .logo{display:none}
.brand .nm{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.035em;line-height:1.05}
.brand .nm .ai{display:inline-block;margin-left:2px;padding:0 5px 1px;border-radius:2px;background:var(--cta);color:var(--cta-fg);font-size:.72em;letter-spacing:0;vertical-align:2px;animation:mk .6s var(--back) .3s both}
@keyframes mk{from{transform:scale(.5);opacity:0}}
.brand .nm small{display:block;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:2px;margin-left:8px;position:relative}
.nav a{padding:10px 13px;min-height:44px;display:inline-flex;align-items:center;color:var(--muted);font-weight:500;font-size:15px;transition:color .2s}
.nav a:hover{text-decoration:none;color:var(--fg)}
.nav a.on{color:var(--fg)}
.nav .ind{position:absolute;bottom:2px;height:2px;background:var(--fg);transition:left .4s var(--ease),width .4s var(--ease),opacity .2s;pointer-events:none}
.model{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:2px;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2.4s infinite}
.dot.off{background:var(--crit);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.iconbtn{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:color .2s,border-color .2s,transform .45s var(--back);flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--fg);transform:rotate(-20deg)}
@media(max-width:700px){.brand .nm small,.model{display:none}.nav{margin-left:0}.nav a{padding:10px 9px}}

main{max-width:1320px;margin:0 auto;padding:40px max(16px,3vw) 96px}
main.enter>*{animation:rise .5s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* появление при прокрутке (классы ставит скрипт) */
.rv{opacity:0;transform:translateY(18px);transition:opacity .45s var(--ease) var(--d,0ms),transform .55s var(--back) var(--d,0ms)}
.rv.up{transform:translateY(-18px)}
.rv.in{opacity:1;transform:none}
.fcard.rv,table.t tbody tr.rv{transition-timing-function:var(--ease)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--panel);padding:10px 18px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:15px;transition:background .22s,transform .22s var(--ease),box-shadow .22s,border-color .22s,color .22s;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--soft);border-color:var(--faint);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.btn.primary:hover{background:var(--cta-2);border-color:var(--cta-2);transform:translateY(-1px);box-shadow:0 10px 20px -12px color-mix(in srgb,var(--cta) 95%,transparent)}
.btn .arr{transition:transform .3s var(--ease)}.btn:hover .arr{transform:translateX(3px)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.1}
h2{font-size:19px;line-height:1.3;letter-spacing:-.015em}
.eyebrow{font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--acc);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:20px;height:2px;background:currentColor}

/* ---------- новая проверка ---------- */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,80px);align-items:center}
@media(max-width:1000px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(34px,5vw,62px);line-height:1;margin:20px 0 22px;letter-spacing:-.05em}
.hero h1 .hl{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 85%/0% 32%;animation:hlsweep 1s .5s var(--ease) forwards;padding:0 .06em}
@keyframes hlsweep{to{background-size:100% 32%}}
.lead{font-size:18px;color:var(--muted);max-width:58ch;margin:0 0 30px}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:var(--r);padding:30px 24px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .25s,background .25s,transform .3s var(--ease)}
.drop:hover,.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc-soft) 50%,var(--panel))}
.drop.over{transform:scale(1.01)}
.drop .ic{width:50px;height:50px;margin:0 auto 12px;border-radius:2px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;transition:transform .45s var(--back)}
.drop:hover .ic,.drop.over .ic{transform:translateY(-5px)}
.drop b{font-size:17px;display:block;margin-bottom:2px}
.drop .muted{font-size:14px}
.chosen{display:flex;align-items:center;gap:12px;text-align:left;margin-top:16px;padding:11px 13px;border-radius:var(--r);background:var(--soft);cursor:default;animation:rise .4s var(--ease)}
.chosen .fi{width:38px;height:44px;border-radius:2px;background:var(--sheet);border:1px solid var(--line);display:grid;place-items:center;font:700 10.5px var(--mono);color:var(--acc);flex:none}
.opts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.chk{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14.5px;cursor:pointer;min-height:44px}
.chk input{accent-color:var(--acc);width:17px;height:17px}
.sample{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-top:18px;transition:border-color .2s,box-shadow .3s}
.sample:hover{border-color:var(--acc);box-shadow:var(--shadow-lg)}
.sample .fi{width:40px;height:50px;border-radius:2px;background:var(--sheet);border:1px solid var(--line);position:relative;flex:none;display:grid;place-items:end center;padding-bottom:6px;font:700 9.5px var(--mono);color:var(--crit)}
.sample .fi::before{content:"";position:absolute;left:7px;right:7px;top:9px;height:14px;background:repeating-linear-gradient(var(--soft2) 0 2px,transparent 2px 5px)}
.sample .fi::after{content:"";position:absolute;left:7px;width:16px;top:14px;height:4px;background:var(--mark)}

/* образец листа с пометками */
.specimen{position:relative;padding:18px 0 22px 18px}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:1px;padding:26px 28px 30px;box-shadow:var(--shadow-lg);width:min(100%,440px);overflow:hidden}
.sheet::before{content:"";position:absolute;inset:0 auto 0 44px;width:1px;background:color-mix(in srgb,var(--crit) 25%,transparent)}
.sheet::after{content:"";position:absolute;right:0;top:0;width:24px;height:24px;background:linear-gradient(225deg,var(--bg) 50%,var(--line) 50%,var(--soft2) 62%)}
.sh-head{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;padding:0 20px 0 28px}
.sh-t{font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.015em;margin:0 0 10px;padding-left:28px}
.sl{margin:0 0 9px;padding-left:28px;font-size:13.5px;line-height:1.6;color:color-mix(in srgb,var(--fg) 84%,transparent);position:relative}
.sl .n{position:absolute;left:0;top:1px;font:10.5px var(--mono);color:var(--faint)}
.sl mark{color:inherit;padding:0 1px;background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 55%/0% 80%;transition:background-size .7s var(--ease) var(--d,0s)}
.sl mark.c{--hl:color-mix(in srgb,var(--crit) 28%,transparent)}.sl mark.m{--hl:color-mix(in srgb,var(--major) 30%,transparent)}.sl mark.y{--hl:var(--mark)}
.specimen.play .sl mark{background-size:100% 80%}
.scanl{position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--link) 12%,transparent) 70%,color-mix(in srgb,var(--link) 40%,transparent));border-bottom:1.5px solid var(--link);opacity:0;transform:translateY(-50px)}
.specimen.play .scanl{animation:scan 2.6s .1s ease-in-out}
@keyframes scan{0%{opacity:0;transform:translateY(-50px)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(330px)}}
.note{position:absolute;right:0;width:236px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:1px;padding:9px 12px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow-lg);opacity:0;transform:translateX(18px);transition:opacity .5s var(--ease) var(--d),transform .6s var(--back) var(--d)}
.note b{display:block;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--c);margin-bottom:3px}
.note.c{--c:var(--crit);top:72px}.note.m{--c:var(--major);top:196px}
.specimen.play .note{opacity:1;transform:none}
.qbadge{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:8px;background:var(--acc);color:var(--acc-fg);font:500 12px var(--mono);padding:8px 12px;border-radius:1px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease) 2.7s,transform .5s var(--back) 2.7s}
.qbadge i{width:8px;height:8px;border-radius:50%;background:var(--cta)}
.specimen.play .qbadge{opacity:1;transform:none}
@media(max-width:1000px){.specimen{display:none}}

.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,44px);margin-top:64px;padding-top:28px;border-top:2px solid var(--fg)}
@media(max-width:820px){.feat{grid-template-columns:1fr;gap:22px}}
.feat .f{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.feat .ic{grid-row:span 2;width:36px;height:36px;border-radius:2px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.feat b{font-weight:600;font-size:16.5px}
.feat p{margin:0;color:var(--muted);font-size:14.5px;max-width:44ch}
.recent{margin-top:52px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- ход прогона ---------- */
.runwrap{max-width:800px;margin:8px auto}
.runcard{padding:clamp(20px,4vw,36px);overflow:hidden;position:relative}
.runbar{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--soft2)}
.runbar i{display:block;height:100%;width:0;background:var(--cta);transition:width .8s var(--ease)}
.runhead{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.scanner{width:40px;height:50px;border-radius:1px;border:1.5px solid var(--line);background:var(--sheet);position:relative;overflow:hidden;flex:none}
.scanner::before{content:"";position:absolute;left:7px;right:7px;top:8px;bottom:8px;background:repeating-linear-gradient(var(--soft2) 0 2px,transparent 2px 6px)}
.scanner::after{content:"";position:absolute;left:0;right:0;height:12px;top:-12px;background:linear-gradient(transparent,color-mix(in srgb,var(--link) 40%,transparent));border-bottom:1.5px solid var(--link);animation:scanmini 1.6s ease-in-out infinite}
@keyframes scanmini{to{top:50px}}
.scanner.done{border-color:var(--ok);background:var(--ok-soft);display:grid;place-items:center;color:var(--ok)}
.scanner.done::before,.scanner.done::after{display:none}
.scanner.bad{border-color:var(--crit);background:var(--crit-soft)}.scanner.bad::after{display:none}
.timer{margin-left:auto;font:500 14px var(--mono);color:var(--muted);background:var(--soft);padding:6px 11px;border-radius:2px}
.steps{display:grid}
.step{display:grid;grid-template-columns:36px 1fr;gap:16px;position:relative;padding-bottom:26px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:2px;background:var(--hair)}
.step:not(:last-child)::after{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:2px;background:var(--cta);transform:scaleY(0);transform-origin:top;transition:transform .7s var(--ease)}
.step.done:not(:last-child)::after{transform:scaleY(1)}
.bullet{width:36px;height:36px;border-radius:2px;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);color:var(--faint);font:600 13px var(--mono);z-index:1;transition:background .35s,border-color .35s,color .35s,transform .45s var(--back)}
.step.done .bullet{background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.step.on .bullet{border-color:var(--acc);color:var(--acc);animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 35%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.step.bad .bullet{background:var(--crit);border-color:var(--crit);color:#fff}
.bullet svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.step .t{font-weight:600;padding-top:6px;transition:color .3s}
.step:not(.done):not(.on):not(.bad) .t{color:var(--muted)}
.step .d{color:var(--muted);font-size:14px}
.step [data-cur]{color:var(--acc);font:500 13px var(--mono);margin-top:4px}
.sub{margin-top:9px;height:5px;background:var(--soft2);overflow:hidden;max-width:380px}
.sub i{display:block;height:100%;background:var(--acc);transition:width .6s var(--ease);position:relative;overflow:hidden}
.sub i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
details.log{margin-top:28px;border-top:1px solid var(--hair);padding-top:14px}
details.log summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px}
details.log pre{background:var(--soft);border-radius:2px;padding:12px;font:12px/1.55 var(--mono);max-height:240px;overflow:auto;white-space:pre-wrap;margin:10px 0 0}
.errbox{margin-top:24px;padding:16px 18px;border-radius:2px;background:var(--crit-soft);color:var(--crit);border-left:3px solid var(--crit);animation:rise .4s var(--ease)}
.errbox b{display:block;margin-bottom:4px}

/* ---------- отчёт ---------- */
.rhead{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:22px;border-bottom:2px solid var(--fg)}
.rhead h1{word-break:break-word}
.rhead .meta{color:var(--muted);font:12.5px var(--mono);margin-top:10px;display:flex;gap:6px 18px;flex-wrap:wrap}
.rhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden;border-left:4px solid var(--crit)}
.verdict.ok{border-left-color:var(--ok)}
.verdict b{font-family:var(--f-display);font-weight:600;font-size:19px;display:block;margin-bottom:4px;letter-spacing:-.015em}
.verdict .muted{font-size:15px;max-width:80ch;display:block}
.stamp{--c:var(--crit);color:var(--c);border:2.5px solid var(--c);border-radius:2px;padding:8px 14px;font:700 13px/1.15 var(--mono);text-transform:uppercase;letter-spacing:.08em;text-align:center;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 18%,transparent);animation:stamp .55s cubic-bezier(.3,1.5,.5,1) .45s both;white-space:nowrap}
.stamp small{display:block;font:500 9.5px var(--mono);letter-spacing:.1em;opacity:.8;margin-top:3px}
.verdict.ok .stamp{--c:var(--ok)}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(2)}60%{opacity:1}100%{opacity:1;transform:rotate(-6deg) scale(1)}}
@media(max-width:560px){.verdict{grid-template-columns:1fr}.stamp{justify-self:start}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:14px;overflow:hidden}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:18px 20px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);margin:0 -1px -1px 0;background:none;border-top:0;border-left:0;text-align:left;font:inherit;color:inherit;transition:background .22s}
.kpi.click{cursor:pointer}.kpi.click:hover{background:var(--soft)}
.kpi .v{font-family:var(--f-display);font-size:36px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;margin-top:8px}
.v.crit{color:var(--crit)}.v.major{color:var(--major)}.v.ok{color:var(--ok)}
.sevbar{display:flex;height:6px;overflow:hidden;background:var(--soft2);margin-bottom:28px;gap:2px}
.sevbar i{display:block;transform-origin:left;animation:grow .9s var(--ease) both}
.sevbar i:nth-child(2){animation-delay:.12s}.sevbar i:nth-child(3){animation-delay:.24s}
@keyframes grow{from{transform:scaleX(0)}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;position:relative}
.tab{padding:11px 15px;min-height:44px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg)}
.tab .n{font:500 11.5px var(--mono);background:var(--soft2);border-radius:2px;padding:1px 7px;margin-left:7px;color:var(--muted)}
.tab.on .n{background:var(--acc);color:var(--acc-fg)}
.tabink{position:absolute;bottom:-1px;height:2px;background:var(--fg);transition:left .35s var(--ease),width .35s var(--ease)}
#tabbody{animation:rise .35s var(--ease)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1060px){.split{grid-template-columns:1fr}.docpane{display:none!important}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:2px;min-height:36px;padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:background .2s,color .2s,border-color .2s}
.chip:hover{background:var(--soft);border-color:var(--faint)}
.chip i{width:8px;height:8px;background:var(--c,var(--faint))}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font:12px var(--mono);opacity:.7}
.sel,.search{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);min-height:40px;padding:8px 11px;font:inherit;font-size:14px;color:var(--fg);transition:border-color .2s,box-shadow .2s}
.sel:focus,.search:focus{outline:0;border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 20%,transparent)}
.search{flex:1;min-width:160px}
.activef{display:inline-flex;align-items:center;gap:6px;background:var(--mark-soft);color:var(--fg);border-radius:2px;padding:4px 6px 4px 11px;font-size:14px;font-weight:500;animation:rise .3s var(--ease)}
.activef button{border:0;background:none;cursor:pointer;color:inherit;padding:0 6px;font-size:16px;line-height:1;min-height:28px}
.list{display:grid;gap:10px;scroll-margin-top:84px}
.fcard{padding:16px 18px 16px 21px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .3s,border-color .2s}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--line))}
.fcard:hover{box-shadow:var(--shadow-lg);border-color:var(--faint)}
.fcard.s-critical{--c:var(--crit)}.fcard.s-major{--c:var(--major)}.fcard.s-minor{--c:var(--minor)}
.fcard.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.fhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:10px}
.badge{font:600 10.5px var(--mono);padding:3px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.05em}
.b-critical{background:var(--crit-soft);color:var(--crit)}.b-major{background:var(--major-soft);color:var(--major)}.b-minor{background:var(--minor-soft);color:var(--minor)}
.b-set{background:var(--acc-soft);color:var(--acc)}
.crit{font-weight:600}
.rid{font:12px var(--mono);background:var(--soft);padding:2px 6px;border-radius:2px;color:var(--muted)}
.loc{font:12px var(--mono);color:var(--faint);margin-left:auto}
.quote{border-left:2px solid var(--mark);background:color-mix(in srgb,var(--mark-soft) 60%,transparent);padding:8px 12px;font-size:14.5px;margin-bottom:10px}
.quote::before{content:"«";color:var(--faint)}.quote::after{content:"»";color:var(--faint)}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;font-size:14.5px}
.kv .k{color:var(--muted);font:500 11.5px/2 var(--mono);text-transform:uppercase;letter-spacing:.05em}
.kv .fix{color:var(--ok)}
.rel{margin-top:10px;font-size:13px;color:var(--muted)}
.empty{padding:44px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

.docpane{position:sticky;top:84px;max-height:calc(100vh - 106px);display:flex;flex-direction:column;background:var(--sheet);overflow:hidden}
.docpane .dh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.legend{margin-left:auto;display:flex;gap:10px;font:11px var(--mono);color:var(--faint)}
.legend span{display:inline-flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;background:var(--c)}
.doc{overflow:auto;padding:8px 0;font-size:13.5px;line-height:1.6}
.ln{display:grid;grid-template-columns:48px minmax(0,1fr);padding:1px 14px 1px 0;border-left:3px solid transparent;transition:background .25s}
.ln .no{color:var(--faint);text-align:right;padding-right:12px;font:11px/1.95 var(--mono);user-select:none}
.ln .tx{white-space:pre-wrap;word-break:break-word}
.ln.h-critical{background:var(--crit-soft);border-left-color:var(--crit);cursor:pointer}
.ln.h-major{background:var(--major-soft);border-left-color:var(--major);cursor:pointer}
.ln.h-minor{background:var(--minor-soft);border-left-color:var(--minor);cursor:pointer}
.ln[class*=h-]:hover{filter:brightness(.97)}
.ln.focus{box-shadow:inset 0 0 0 2px var(--link)}
.ln .cnt{float:right;font:700 10.5px var(--mono);border-radius:2px;padding:0 6px;margin-left:8px;background:var(--panel);color:var(--muted)}
.ln .tx.hd{font-weight:700}.ln .tx.sep{color:var(--faint)}
.pg{margin:12px 14px 6px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--faint);display:flex;align-items:center;gap:10px}
.pg::after{content:"";flex:1;height:1px;background:var(--hair)}
@keyframes flash{0%{background:color-mix(in srgb,var(--mark) 70%,transparent)}100%{}}
.ln.flash{animation:flash 1.4s ease-out}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px;border-bottom:2px solid var(--fg);background:var(--panel);position:sticky;top:0;z-index:1}
table.t td{padding:11px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--soft)}
.tablewrap{overflow:auto;max-height:72vh}
.fixes{counter-reset:f;display:grid;gap:10px}
.fx{padding:17px 20px 17px 66px;position:relative}
.fx::before{counter-increment:f;content:counter(f,decimal-leading-zero);position:absolute;left:18px;top:16px;width:32px;height:28px;border-radius:2px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font:600 12.5px var(--mono)}
.fx .m{font:12px var(--mono);color:var(--faint);margin-bottom:4px}
.fx .p{margin-bottom:6px}.fx .s{color:var(--ok)}
.passport{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 20px;padding:22px 24px;font-size:14.5px}
.passport .k{color:var(--muted);font:500 11.5px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:560px){.passport{grid-template-columns:1fr;gap:2px}.passport .k{margin-top:10px}}

/* ---------- история ---------- */
.hrow{display:grid;grid-template-columns:minmax(0,2.2fr) 1.2fr 1fr 1.3fr auto;gap:16px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .2s}
.hrow:last-child{border-bottom:0}
.hrow:not(.head):hover{background:var(--soft)}
.hrow:not(.head):hover .name{color:var(--link)}
.hrow.head{cursor:default;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:13px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.hrow .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.hrow .sub2{font-size:13px;color:var(--muted)}
.hrow .mono{font-family:var(--mono);font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:2px}
.st.run{background:var(--acc-soft);color:var(--acc)}.st.bad{background:var(--crit-soft);color:var(--crit)}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.warn{background:var(--major-soft);color:var(--major)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.hrow{grid-template-columns:minmax(0,1fr) auto}.hrow>:nth-child(3),.hrow>:nth-child(4),.hrow>:nth-child(5){display:none}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:2px;font-size:14px;box-shadow:var(--shadow-lg);z-index:50;animation:toastin .35s var(--back)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}}
@media print{body{background:#fff}.top,.tabs,.filters,.rhead .acts,.docpane{display:none!important}.split{display:block}.rv{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero h1 .hl{background-size:100% 32%}.rv{opacity:1;transform:none}}

/* ================= Компоновка в духе продуктовых сайтов (mistral.ai): =================
   лёгкая шапка «логотип | меню по центру | действие справа», огромный заголовок, выезжающий построчно,
   большое «окно продукта» на первом экране, бегущая строка, секции с крупными заголовками, большой подвал.
   Цвета и шрифты — свои (дизайн-система выше). */
.wrap{max-width:1320px;margin:0 auto}
main{padding-top:36px}
main:has(>.hero){padding-top:0}

/* шапка */
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid transparent;transition:transform .45s var(--ease),border-color .3s,background .3s}
.top.scrolled{border-bottom-color:var(--line);box-shadow:none}
.top .in{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;padding:12px max(16px,3vw)}
.top.scrolled .in{padding-top:8px;padding-bottom:8px}
.brand .nm small{display:none}
.nav{margin:0;justify-self:center;background:var(--soft);border:1px solid var(--hair);padding:4px;gap:0;border-radius:6px}
.nav a{position:relative;z-index:1;min-height:36px;padding:6px 14px;font-size:14.5px;border-radius:4px}
.nav .ind{bottom:4px;top:4px;height:auto;background:var(--panel);border-radius:4px;box-shadow:0 1px 2px rgba(15,23,42,.12),0 0 0 1px var(--hair);z-index:0}
.tools{justify-self:end;display:flex;align-items:center;gap:8px}
.tools .model{margin:0}
.tools .iconbtn{width:40px;height:40px}
.tools .btn.sm{min-height:40px;padding:8px 14px}
@media(max-width:980px){.nav a[data-jump]{display:none}}
@media(max-width:760px){.top .in{grid-template-columns:auto 1fr auto}.nav{justify-self:start}.tools .model,.tools .cta-top{display:none}}

/* общий ритм секций */
.sec{padding-block:clamp(64px,9vw,128px) 0}
.sec-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:24px 48px;align-items:end;margin-bottom:clamp(28px,4vw,48px)}
.sec-head p{margin:0;color:var(--muted);font-size:17px;max-width:52ch}
@media(max-width:860px){.sec-head{grid-template-columns:1fr}}
h2.big{font-size:clamp(30px,4vw,54px);line-height:1.02;letter-spacing:-.045em;margin-top:14px}

/* первый экран */
.hero{display:block;padding-top:clamp(36px,6vw,84px)}
.chip-eyebrow{max-width:100%;flex-wrap:wrap;display:inline-flex;align-items:center;gap:10px;font:500 12.5px var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;animation:rise .6s var(--ease) both}
.chip-eyebrow .pulse{width:8px;height:8px;border-radius:50%;background:var(--cta);animation:ping 2.4s infinite}
.hero h1.mega{font-size:clamp(36px,8.4vw,124px);overflow-wrap:anywhere;line-height:.94;letter-spacing:-.06em;margin:22px 0 0;font-weight:700}
.mega .l{display:block;overflow:hidden;padding-bottom:.06em}
.mega .l>span{display:inline-block;transform:translateY(108%);animation:lineup 1s var(--ease) forwards}
.mega .l:nth-child(2)>span{animation-delay:.12s}
.hero h1.mega .hl{background:linear-gradient(color-mix(in srgb,var(--mark) 80%,transparent),color-mix(in srgb,var(--mark) 80%,transparent)) no-repeat 0 92%/0% 20%;animation:hlsweep2 .9s .9s var(--ease) forwards}
@keyframes hlsweep2{to{background-size:100% 20%}}
@keyframes lineup{to{transform:none}}
.hero-sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 48px;align-items:end;margin-top:clamp(24px,3vw,40px)}
.hero-sub .lead{margin:0;font-size:clamp(17px,1.5vw,20px);max-width:56ch;animation:rise .8s .35s var(--ease) both}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;animation:rise .8s .45s var(--ease) both}
.btn.lg{min-height:52px;padding:12px 22px;font-size:16px}
@media(max-width:860px){.hero-sub{grid-template-columns:1fr}}

/* окно продукта */
.window{margin-top:clamp(36px,5vw,64px);border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;
  box-shadow:0 40px 80px -40px rgba(15,23,42,.35),0 0 0 6px color-mix(in srgb,var(--soft2) 60%,transparent);
  animation:winin 1.1s .5s var(--ease) both;transform-origin:50% 0}
@keyframes winin{from{opacity:0;transform:translateY(40px) scale(.97)}}
.win-bar{display:flex;align-items:center;gap:7px;padding:11px 16px;border-bottom:1px solid var(--hair);background:var(--soft);font:12px var(--mono);color:var(--faint)}
.win-bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.win-bar span{margin-left:10px}
.win-bar .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;color:var(--ok)}
.win-bar .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2.4s infinite}
.win-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:420px}
.win-left{padding:clamp(20px,3vw,36px);border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:4px}
.win-left h3{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}
.win-left .drop{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.win-right{position:relative;background:
  linear-gradient(var(--hair) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--hair) 1px,transparent 1px) 0 0/28px 28px,var(--soft);
  display:grid;place-items:center;padding:28px;overflow:hidden}
.win-right .specimen{width:100%;max-width:470px}
.win-right .sheet{width:min(100%,340px)}
.win-right .note{width:210px}
@media(max-width:1000px){.win-body{grid-template-columns:1fr}.win-left{border-right:0}.win-right{display:none}}
.specimen{display:block}

/* бегущая строка критериев */
.marquee{margin-top:clamp(56px,7vw,96px);border-block:1px solid var(--line);overflow:hidden;padding-block:18px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;gap:0;animation:marq 48s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{display:inline-flex;align-items:center;gap:18px;padding-right:18px;font-size:clamp(20px,2.2vw,30px);font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.track span::after{content:"";width:10px;height:10px;background:var(--mark);transform:rotate(45deg)}
.track span em{font:500 12px var(--mono);color:var(--faint);font-style:normal;letter-spacing:.04em}
@keyframes marq{to{transform:translateX(-50%)}}

/* как это работает */
.how-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--fg)}
@media(max-width:980px){.how-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.how-grid{grid-template-columns:1fr}}
.stepc{padding:26px 24px 30px 0;border-right:1px solid var(--hair);padding-left:24px;position:relative;transition:background .3s}
.stepc:first-child{padding-left:0}.stepc:last-child{border-right:0}
.stepc .no{display:block;font:600 13px var(--mono);color:var(--faint);margin-bottom:46px;transition:color .3s}
.stepc b{display:block;font-size:20px;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
.stepc p{margin:0;color:var(--muted);font-size:15px}
.stepc::before{content:"";position:absolute;left:0;right:0;top:-2px;height:2px;background:var(--cta);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.stepc:hover::before{transform:scaleX(1)}.stepc:hover .no{color:var(--cta)}
@media(max-width:980px){.stepc,.stepc:first-child{padding-left:0;border-right:0;border-bottom:1px solid var(--hair)}}

/* возможности */
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:0;border:0}
@media(max-width:900px){.feat{grid-template-columns:1fr}}
.feat .f{display:flex;flex-direction:column;gap:10px;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:250px;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s;animation:none}
.feat .f:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(15,23,42,.35);border-color:var(--faint)}
.feat .ic{width:48px;height:48px;border-radius:6px;background:var(--acc);color:var(--acc-fg);margin-bottom:0;transition:transform .5s var(--back)}
.feat .f:hover .ic{transform:rotate(-8deg) scale(1.06)}
.feat b{font-size:21px;letter-spacing:-.02em;margin-top:28px}
.feat p{font-size:15px}
.feat .big-n{font:700 44px/1 var(--f-display);letter-spacing:-.05em;color:var(--fg);margin-top:28px}

/* последние проверки */
.recent{margin-top:0}

/* подвал */
.foot{margin-top:clamp(80px,10vw,140px);border-top:1px solid var(--line);padding-top:28px;overflow:hidden}
.foot-row{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;font:12.5px var(--mono);color:var(--faint)}
.foot-word{font:700 clamp(64px,17vw,250px)/.8 var(--f-display);letter-spacing:-.07em;color:var(--soft2);margin:36px 0 -0.08em;white-space:nowrap;user-select:none;
  background:linear-gradient(90deg,var(--soft2),color-mix(in srgb,var(--acc) 22%,var(--soft2)),var(--soft2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wordshine 9s linear infinite}
@keyframes wordshine{to{background-position:-200% 0}}

/* появление при прокрутке — новые блоки */
.stepc.rv,.feat .f.rv{transition:opacity .6s var(--ease) var(--d,0ms),transform .7s var(--ease) var(--d,0ms)}

@media(prefers-reduced-motion:reduce){.mega .l>span{transform:none}.hero h1.mega .hl{background-size:100% 26%}.track{animation:none;flex-wrap:wrap}.window{animation:none}}
</style>

<body>
<header class="top" id="top"><div class="in">
  <a class="brand" href="#/" id="brand" aria-label="TekserAI — на главную"><img class="logo-img" src="/logo" alt="" onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><span class="nm">Tekser<span class="ai">AI</span><small>проверка требований · ISO 29148</small></span></a>
  <nav class="nav" id="nav"><span class="ind" aria-hidden="true"></span><a href="#/" data-nav="new">Проверка</a><a href="#/history" data-nav="history">История</a><a href="#/" data-jump="how">Как это работает</a></nav>
  <div class="tools"><div class="model" title="Модель из файла .env"><span class="dot" id="mdot"></span><span id="mname">…</span></div><button class="iconbtn" id="theme" title="Сменить тему" aria-label="Сменить тему"></button><a class="btn primary sm cta-top" href="#/" data-jump="upload">Проверить документ</a></div>
  <span class="progress" aria-hidden="true"></span>
</div></header>
<main id="view"></main>
<div class="toast hidden" id="toast"></div>

<script>
"use strict";
const CRIT={necessary:"Необходимость",appropriate:"Уместность уровня",unambiguous:"Однозначность",complete:"Полнота",singular:"Единичность",feasible:"Выполнимость",verifiable:"Проверяемость",correct:"Корректность",conforming:"Соответствие шаблону",consistent:"Непротиворечивость",traceable:"Трассируемость",comprehensible:"Понятность"};
const SEV={critical:"критичный",major:"существенный",minor:"незначительный"};
const SEVN={critical:"Критичные",major:"Существенные",minor:"Незначительные"};
const SEVC={critical:"var(--crit)",major:"var(--major)",minor:"var(--minor)"};
const RANK={critical:3,major:2,minor:1};
const STEPS=[["Нарезка на требования","Модель выделяет отдельные требования и их место в документе"],
             ["Проверка каждого требования","12 критериев ISO/IEC/IEEE 29148 п. 5.2.5 и IEEE 830"],
             ["Проверка набора целиком","Противоречия, пропуски, соответствие части A и API"],
             ["Проверка цитат и отчёт","Каждая цитата ищется в документе, ненайденные отбрасываются"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view=$("#view");
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
let timer=null,tick=null,loop=null,info={};
const api=async(u,o)=>{const r=await fetch(u,o);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");t.style.animation="none";void t.offsetWidth;t.style.animation="";clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),3200)}
const icon={
 up:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
 quote:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h9M4 16h12"/><path d="M16 14l2 2 4-4"/></svg>',
 book:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
 lock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
 check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 dl:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
 ext:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 back:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
 arr:'<svg class="arr" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
const ext=n=>(n||"").split(".").pop().toUpperCase().slice(0,4);
function fmtDur(a,b){if(!a)return"";const s=Math.max(0,Math.round(((b?new Date(b.replace(" ","T")):new Date())-new Date(a.replace(" ","T")))/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function lineOf(loc){const m=/строка (\d+)/.exec(loc||"");return m?+m[1]-1:-1}
function plural(n,a,b,c){n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k===1?a:k>1&&k<5?b:c}
function countUp(root){root.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suf||"";
  if(REDUCED||!to){el.textContent=to+suf;return}const t0=performance.now(),dur=900;
  const st=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function enter(){view.classList.remove("enter");void view.offsetWidth;view.classList.add("enter");setTimeout(()=>reveal(view),0);setTimeout(moveInd,0)}
/* ---------- анимация при прокрутке ---------- */
const RV_SEL=".feat .f,.stepc,.kpi,.fcard,.fx,.hrow:not(.head),table.t tbody tr,.passport,.recent .panel";
let goingUp=false;
const io=("IntersectionObserver" in window&&!REDUCED)?new IntersectionObserver(es=>{let k=0;
  es.forEach(e=>{const el=e.target;
    if(e.isIntersecting){el.classList.toggle("up",goingUp&&!el.classList.contains("in"));void el.offsetWidth;el.style.setProperty("--d",Math.min(k++,8)*45+"ms");el.classList.add("in")}
    else{el.style.setProperty("--d","0ms");el.classList.remove("in");el.classList.toggle("up",e.boundingClientRect.top<0)}})},{rootMargin:"0px 0px -6% 0px",threshold:.08}):null;
function reveal(root){root.querySelectorAll(RV_SEL).forEach(el=>{if(el.classList.contains("rv"))return;
  if(!io){return}el.classList.add("rv");io.observe(el)})}
/* шапка: прячется вниз, появляется вверх; сжимается; полоса прогресса */
const topEl=document.getElementById("top");let lastY=scrollY,ticking=false;
function onScroll(){const y=scrollY,dy=y-lastY;goingUp=dy<0;
  topEl.classList.toggle("scrolled",y>10);
  if(!REDUCED&&!topEl.contains(document.activeElement)){if(dy>6&&y>160)topEl.classList.add("hide");else if(dy<-6||y<160)topEl.classList.remove("hide")}
  const h=document.documentElement.scrollHeight-innerHeight;topEl.style.setProperty("--p",h>0?Math.min(1,y/h).toFixed(4):0);
  lastY=y;ticking=false}
addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
/* навигация: «таблетка» переезжает к активному пункту */
function moveInd(){const nav=document.getElementById("nav"),ind=nav.querySelector(".ind"),on=nav.querySelector("a.on");
  if(!on){ind.style.opacity=0;return}ind.style.opacity=1;ind.style.left=on.offsetLeft+"px";ind.style.width=on.offsetWidth+"px"}
addEventListener("resize",moveInd);
/* тема */
const SUN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      MOON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function paintTheme(){document.getElementById("theme").innerHTML=isDark()?SUN:MOON}
try{const t=localStorage.getItem("tekser-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
document.getElementById("theme").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("tekser-theme",t)}catch(e){}paintTheme()};
paintTheme();

/* ---------- router ---------- */
function route(){clearTimeout(timer);clearInterval(tick);clearInterval(loop);
  const h=location.hash.replace(/^#\/?/,"").split("/");
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===(h[0]==="history"?"history":h[0]===""?"new":"")));
  if(h[0]==="run"&&h[1])return showRun(h[1]);
  if(h[0]==="report"&&h[1])return showReport(h[1],h[2]);
  if(h[0]==="history")return showHistory();
  return showNew()}
window.addEventListener("hashchange",route);
/* якоря на главной: «Как это работает», «Проверить документ» */
let pendingJump=null;
document.addEventListener("click",e=>{const a=e.target.closest("[data-jump]");if(!a)return;e.preventDefault();const id=a.dataset.jump;
  if(location.hash&&location.hash!=="#/"&&location.hash!=="#"){pendingJump=id;location.hash="#/"}
  else document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"})});

/* ---------- new ---------- */
let picked=null;
async function showNew(){
  view.innerHTML=`<section class="hero">
    <div class="chip-eyebrow"><span class="pulse"></span>ISO/IEC/IEEE 29148 · IEEE 830 · ${esc(info.model||"модель из .env")}</div>
    <h1 class="mega"><span class="l"><span>Проверка требований</span></span><span class="l"><span>до первой <span class="hl">строки кода</span></span></span></h1>
    <div class="hero-sub">
      <p class="lead">TekserAI разбивает ТЗ на отдельные требования, проверяет каждое и весь набор по 12 критериям качества и подкрепляет каждое замечание цитатой из документа.</p>
      <div class="hero-cta">${info.sample?`<button class="btn primary lg" id="sample2">Проверить выданный документ ${icon.arr}</button>`:""}<a class="btn lg" href="#/" data-jump="upload">Загрузить свой</a></div>
    </div>
    <div class="window" id="upload">
      <div class="win-bar" aria-hidden="true"><i></i><i></i><i></i><span>TekserAI · новая проверка</span><span class="live">агент готов</span></div>
      <div class="win-body">
        <div class="win-left">
          <h3>Загрузите документ</h3>
          <div class="drop" id="drop" tabindex="0" role="button" aria-label="Выбрать документ">
            <div class="ic">${icon.up}</div>
            <b>Перетащите файл сюда</b>
            <span class="muted">или нажмите, чтобы выбрать · PDF, DOCX, MD, TXT до 25 МБ</span>
            <input type="file" id="file" accept=".pdf,.docx,.md,.txt" hidden>
            <div id="chosen" style="width:100%"></div>
          </div>
          <div class="opts">
            <button class="btn primary" id="go" disabled>Запустить проверку ${icon.arr}</button>
            <label class="chk"><input type="checkbox" id="nocache"> Без кэша: заново спросить модель</label>
          </div>
          <div class="panel sample ${info.sample?"":"hidden"}">
            <div class="fi">PDF</div>
            <div style="flex:1;min-width:0"><b>Выданный документ</b><div class="muted" style="font-size:13px">${esc(info.sample_name||"requirements.pdf")}: «Уведомление о расходах по карте», части A и B</div></div>
            <button class="btn" id="sample">Проверить ${icon.arr}</button>
          </div>
        </div>
        <div class="win-right">
          <div class="specimen" id="spec" aria-hidden="true">
            <div class="sheet">
              <div class="sh-head"><span>Часть A · Функциональные</span><span>стр. 2</span></div>
              <p class="sh-t">Уведомление о расходах</p>
              <p class="sl"><span class="n">Ф-3</span>Система отправляет push-уведомление <mark class="c" style="--d:.5s">в кратчайшие сроки</mark> после превышения порога расходов.</p>
              <p class="sl"><span class="n">Ф-4</span>Порог задаётся клиентом в приложении в тенге.</p>
              <p class="sl"><span class="n">Ф-5</span>При возврате покупки сумма расходов <mark class="m" style="--d:1.2s">корректируется соответствующим образом</mark>.</p>
              <p class="sl"><span class="n">Ф-6</span>Уведомление содержит сумму, <mark class="y" style="--d:1.8s">остаток лимита</mark> и дату операции.</p>
              <i class="scanl"></i>
            </div>
            <div class="note c" style="--d:1s"><b>Критичный · Проверяемость</b>«В кратчайшие сроки» не проверить тестом. Укажите срок, например не позже 60 с.</div>
            <div class="note m" style="--d:1.7s"><b>Существенный · Полнота</b>Не описан частичный возврат и возврат в закрытом месяце.</div>
            <div class="qbadge"><i></i>цитата найдена в документе дословно</div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="marquee" aria-label="Критерии проверки"><div class="track">${[0,1].map(()=>Object.values(CRIT).map((c,i)=>`<span>${c}<em>${String(i+1).padStart(2,"0")}</em></span>`).join("")).join("")}</div></section>
  <section class="sec" id="how">
    <div class="sec-head"><div><div class="eyebrow">Как это работает</div><h2 class="big">Четыре шага от документа до отчёта</h2></div><p>Ход проверки виден в реальном времени: какой шаг идёт и сколько пачек требований осталось. Отчёт открывается сам.</p></div>
    <div class="how-grid">${STEPS.map((s,i)=>`<div class="stepc"><span class="no">${String(i+1).padStart(2,"0")} / 04</span><b>${s[0]}</b><p>${s[1]}</p></div>`).join("")}</div>
  </section>
  <section class="sec">
    <div class="sec-head"><div><div class="eyebrow">Почему отчёту можно верить</div><h2 class="big">Замечания с доказательствами, а не мнения модели</h2></div><p>Каждое замечание привязано к месту в документе. Если цитату не удалось найти дословно, замечание не попадает в отчёт.</p></div>
    <div class="feat">
      <div class="f"><div class="ic">${icon.quote}</div><b>Без выдуманных замечаний</b><p>Каждая цитата ищется в исходном документе. Ненайденные отбрасываются, и отчёт показывает, сколько цитат подтверждено.</p></div>
      <div class="f"><div class="ic">${icon.book}</div><b>По стандартам</b><p>12 свойств отдельного требования и набора: однозначность, проверяемость, полнота, непротиворечивость и другие.</p></div>
      <div class="f"><div class="ic">${icon.lock}</div><b>Можно без облака</b><p>С провайдером Ollama документ проверяет локальная модель, и он не покидает компьютер.</p></div>
    </div>
  </section>
  <section class="sec recent"><div class="sechead"><h2 class="big" style="margin:0">Последние проверки</h2><a class="btn" href="#/history">Вся история ${icon.arr}</a></div><div class="panel" id="recent"><div class="empty">Загрузка…</div></div></section>
  <footer class="foot"><div class="foot-row"><span>TekserAI · агент проверки требований</span><span>ISO/IEC/IEEE 29148:2018 · IEEE Std 830-1998</span><span>Хакатон BCC-HUB 2026</span></div><div class="foot-word" aria-hidden="true">TekserAI</div></footer>`;
  enter();
  const spec=$("#spec");const play=()=>{spec.classList.remove("play");void spec.offsetWidth;spec.classList.add("play")};
  if(REDUCED)spec.classList.add("play");else{setTimeout(play,350);loop=setInterval(play,9000)}
  const drop=$("#drop"),file=$("#file");
  drop.onclick=e=>{if(!e.target.closest(".chosen"))file.click()};
  drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click()}};
  file.onchange=()=>pick(file.files[0]);
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>pick(e.dataTransfer.files[0]));
  if(picked)pick(picked);
  $("#go").onclick=()=>start(`/api/run?name=${encodeURIComponent(picked.name)}&no_cache=${nc()}`,{method:"POST",body:picked});
  $("#sample").onclick=()=>start(`/api/run-sample?no_cache=${nc()}`,{method:"POST"});
  if($("#sample2"))$("#sample2").onclick=()=>start(`/api/run-sample?no_cache=${nc()}`,{method:"POST"});
  if(pendingJump){const j=pendingJump;pendingJump=null;setTimeout(()=>document.getElementById(j)?.scrollIntoView({behavior:"smooth",block:"start"}),80)}
  renderRows($("#recent"),(await api("/api/runs").catch(()=>[])).slice(0,4),true);
}
const nc=()=>$("#nocache")?.checked?"1":"0";
function pick(f){if(!f)return;
  if(!/\.(pdf|docx|md|txt)$/i.test(f.name)){toast("Поддерживаются PDF, DOCX, MD и TXT");return}
  picked=f;$("#chosen").innerHTML=`<div class="chosen"><div class="fi">${esc(ext(f.name))}</div><div style="flex:1;min-width:0"><b style="font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><span class="muted" style="font-size:12.5px">${(f.size/1024).toFixed(0)} КБ · готов к проверке</span></div><button class="btn ghost sm" id="unpick">Убрать</button></div>`;
  $("#unpick").onclick=e=>{e.stopPropagation();picked=null;$("#chosen").innerHTML="";$("#go").disabled=true};
  $("#go").disabled=false}
async function start(url,opt){try{const d=await api(url,opt);picked=null;location.hash="#/run/"+d.id}catch(e){toast(e.message)}}

/* ---------- run ---------- */
async function showRun(id){
  view.innerHTML=`<div class="runwrap"><div class="panel runcard">
   <div class="runbar"><i id="rbar"></i></div>
   <div class="runhead"><div class="scanner" id="spin"></div><div style="min-width:0"><div class="eyebrow">Идёт проверка</div><h2 id="rtitle" style="margin-top:4px">Читаю документ</h2><div class="muted" id="rdoc" style="font-size:13px"></div></div><span class="timer num" id="tm">0:00</span></div>

  </div></div>`;
  enter();

  $("#stop").onclick=async()=>{try{await api(`/api/runs/${id}/stop`,{method:"POST"});toast("Останавливаю…")}catch(e){toast(e.message)}};

    started=d.started||d.created;finished=d.finished||null;$("#tm").textContent=fmtDur(started,finished);

        cur.textContent=t?"→ "+t:"";const m=/(\d+)\/(\d+)\s*$/.exec(t);if(m){frac=(+m[1])/(+m[2]);sub.classList.remove("hidden");sub.firstElementChild.style.width=(100*frac)+"%"}else sub.classList.add("hidden")}
      else{cur.textContent="";sub.classList.add("hidden")}});
    $("#rbar").style.width=(done?100:Math.max(3,100*(Math.max(0,step-1)+frac*.9)/4))+"%";
    if(step&&!done&&!bad)$("#rtitle").textContent=STEPS[step-1][0];
    $("#log").textContent=log;
    if(done){$("#spin").className="scanner done";$("#spin").innerHTML=icon.check;$("#rtitle").textContent="Готово, открываю отчёт";
      setTimeout(()=>{if(location.hash==="#/run/"+id)location.hash="#/report/"+id},900);return}
    if(bad){$("#spin").className="scanner bad";$("#rtitle").textContent="Проверка не выполнена";
      let reason="";try{const r=await api(`/api/runs/${id}/report`);reason=r.error?.reason||""}catch(e){}
      if(!reason)reason=lines.filter(l=>/Ошибка|ошибка|Error/.test(l)).pop()||lines.pop()||"";

      $("#rerr").innerHTML=`<div class="errbox"><b>Причина</b>${esc(reason)}</div>`;
      $("#ract").innerHTML=`<a class="btn primary" href="#/">Новая проверка</a><a class="btn" href="#/history">История</a>`;
      document.querySelector("details.log").open=true;return}
    timer=setTimeout(poll,1000)};
  poll()}

  </article>`).join(""):`<div class="panel empty"><b>Под эти фильтры замечаний нет</b>Попробуйте другой критерий или уровень либо сбросьте фильтры.<br><button class="btn sm" id="fclear" style="margin-top:14px">Сбросить фильтры</button></div>`;

    <div>${stBadge(r)}</div>
    <div class="sub2 num">${s.requirements!=null?`${s.requirements} / ${s.findings}`:"—"}</div>
    <div class="sub2 mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.model||"—")}</div>
    <div>${compact?"":`<button class="btn ghost sm danger" data-del="${esc(r.id)}">Удалить</button>`}</div></div>`}).join("");
  box.querySelectorAll(".hrow[data-id]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-del]"))return;
    const st=el.dataset.st;location.hash=(st==="done"?"#/report/":"#/run/")+el.dataset.id});
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{e.stopPropagation();
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Точно удалить?";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="Удалить"}},3000);return}
    try{await api(`/api/runs/${b.dataset.del}/delete`,{method:"POST"});toast("Прогон удалён");showHistory()}catch(err){toast(err.message)}})}

/* ---------- init ---------- */
api("/api/info").then(i=>{info=i;$("#mname").textContent=i.model;$("#mdot").classList.toggle("off",/нет \.env/.test(i.model));if(!location.hash||location.hash==="#/")route()}).catch(()=>{$("#mname").textContent="сервер недоступен";$("#mdot").classList.add("off")});
if(location.hash&&location.hash!=="#/")route();
</script>
</body>
</html>
